<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080b14;--card:#0f1322;--card2:#161b2e;--text:#d4d8e8;--dim:#5b6380;--accent:#22d3ee;--accent2:#0891b2;--green:#10b981;--red:#ef4444;--orange:#f59e0b;--yellow:#eab308;--border:#1e2440;--glow:0 0 20px rgba(34,211,238,0.07)}
.light{--bg:#f5f7fa;--card:#ffffff;--card2:#eef1f6;--text:#1a1d26;--dim:#6b7280;--accent:#0891b2;--accent2:#0e7490;--green:#059669;--red:#dc2626;--orange:#d97706;--yellow:#a16207;--border:#d1d5db;--glow:0 0 20px rgba(8,145,178,0.08)}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:13px;height:100vh;overflow:hidden}
#sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--card);padding:16px 12px;padding-top:48px;overflow-y:auto;border-right:1px solid var(--border);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:100}
#sidebar.hidden{transform:translateX(-100%)}
#toggle{position:fixed;left:12px;top:10px;z-index:200;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border);color:var(--dim);padding:4px 10px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1;transition:.2s}
#toggle:hover{color:var(--accent);border-color:var(--accent);transform:scale(1.05)}
#main{padding:12px 16px;overflow-y:auto;height:100vh;margin-left:220px;transition:margin-left .3s}
.sidebar-title{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:16px;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.sidebar-title svg{width:16px;height:16px;fill:var(--accent)}
.ctrl-group{margin-bottom:10px}
.ctrl-group label{display:flex;align-items:center;justify-content:space-between;font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.ctrl-group label .hint{color:var(--accent);font-weight:600;font-size:8px;background:rgba(34,211,238,0.08);padding:1px 6px;border-radius:3px}
.ctrl-group select,.ctrl-group input,.ctrl-group button{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:7px 10px;border-radius:7px;font-size:12px;font-family:inherit;transition:.15s;outline:none}
.ctrl-group select:focus,.ctrl-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,0.1)}
.ctrl-group button{cursor:pointer;background:linear-gradient(135deg,var(--accent),#0d9488);color:#000;font-weight:700;border:none;margin-top:4px;padding:9px 10px;border-radius:7px;font-size:12px;transition:.2s;letter-spacing:.3px}
.ctrl-group button:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 4px 16px rgba(34,211,238,0.2)}
.ctrl-group button:disabled{opacity:.25;cursor:not-allowed;transform:none;filter:none;box-shadow:none}
.ctrl-group button.danger{background:linear-gradient(135deg,var(--red),#b91c1c)}
.ctrl-group button.danger:hover{box-shadow:0 4px 16px rgba(239,68,68,0.2)}
.ctrl-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:8px;padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--glow)}
.top h1{font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--accent),#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.3px}
.top .meta{font-size:10px;color:var(--dim);display:flex;gap:12px}
.top .meta span{display:flex;align-items:center;gap:4px}
#progress{height:4px;background:var(--border);border-radius:3px;margin-bottom:6px;overflow:hidden}
#progress .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green),var(--accent2));background-size:200% 100%;width:0%;transition:width .4s cubic-bezier(.4,0,.2,1);border-radius:3px}
#progress .fill.active{animation:shimmer 2s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.status{font-size:11px;color:var(--dim);margin-bottom:6px;padding:5px 10px;background:var(--card);border-radius:8px;border:1px solid var(--border);min-height:26px;display:flex;align-items:center;gap:8px}
.status .dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
.status .dot.green{background:var(--green);box-shadow:0 0 6px rgba(16,185,129,0.5)}
.status .dot.orange{background:var(--orange);box-shadow:0 0 6px rgba(245,158,11,0.5)}
.status .dot.red{background:var(--red);box-shadow:0 0 6px rgba(239,68,68,0.5)}
.dot.gray{background:var(--dim)}

.top-actions{display:flex;gap:6px;align-items:center;margin-bottom:8px;position:relative;z-index:1000}
.top-actions button{flex:1;padding:8px 14px;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.3px;transition:.2s;font-family:inherit}
.top-actions button:first-child{background:linear-gradient(135deg,var(--accent),#0d9488);color:#000}
.top-actions button.danger{background:linear-gradient(135deg,var(--red),#b91c1c);color:#fff}
.top-actions button:disabled{opacity:.25;cursor:not-allowed;filter:none;transform:none}
.top-actions button:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.tab-bar{display:flex;gap:0;margin-bottom:6px;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.tab-btn{flex:1;padding:7px 10px;border:none;background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit;letter-spacing:.3px}
.tab-btn:hover{color:var(--text);background:rgba(255,255,255,0.03)}
.tab-btn.active{color:var(--accent);background:rgba(34,211,238,0.06);box-shadow:inset 0 -2px 0 var(--accent)}
.tab-btn .badge{font-size:9px;background:var(--card2);padding:1px 6px;border-radius:4px;margin-left:4px;font-weight:400;color:var(--dim)}
.tab-btn.active .badge{color:var(--accent);background:rgba(34,211,238,0.1)}
.tab-panel{display:none}
.tab-panel.active{display:block}
#chart{background:var(--card);border:1px solid var(--border);border-radius:12px;height:280px;margin-bottom:8px;position:relative;overflow:hidden}
#chart canvas{width:100%;height:100%;display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 10px;transition:.2s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:10px 10px 0 0;opacity:0;transition:.2s}
.card:hover::before{opacity:1}
.card:hover{border-color:rgba(34,211,238,0.2);transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.card .lbl{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}
.card .val{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;transition:color .3s}
.green,.val.green{color:var(--green)}.red,.val.red{color:var(--red)}.val.orange{color:var(--orange)}.val.blue{color:var(--accent)}.val.hard{color:#ff6b6b}
.card.blue::before{background:var(--accent)}.card.green::before{background:var(--green)}.card.red::before{background:var(--red)}.card.orange::before{background:var(--orange)}.card.purple::before{background:#a78bfa}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{flex:1;min-width:300px}
.col h3{font-size:10px;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:8px}
.col h3 .badge{font-size:8px;background:var(--card2);padding:2px 7px;border-radius:4px;color:var(--text);font-weight:600}
#tradesHistory,#opentrades{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;max-height:240px;overflow-y:auto;font-size:11px;line-height:1.5}
.hit,.ct,.ot{display:flex;gap:6px;padding:4px 0;border-bottom:1px solid rgba(30,36,64,0.6);font-size:10px;align-items:center}
.ct{display:grid;grid-template-columns:44px 58px 58px 50px 38px;gap:3px;padding:4px 0}
.ct .hdr,.ot .hdr{color:var(--dim);font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.ct .v,.ot .v{text-align:right;font-variant-numeric:tabular-nums}
.ot{display:grid;grid-template-columns:44px 52px 52px 52px 46px 38px;gap:3px;padding:4px 0}
.side-buy{color:var(--green)}.side-sell{color:var(--red)}
.s.tp{color:var(--green);background:rgba(16,185,129,0.1);border-radius:3px;padding:1px 5px;text-align:center;font-weight:600}
.s.hedge{color:var(--yellow);background:rgba(234,179,8,0.1);border-radius:3px;padding:1px 5px;text-align:center;font-weight:600}
.s.expiry{color:var(--orange);background:rgba(245,158,11,0.1);border-radius:3px;padding:1px 5px;text-align:center;font-weight:600}
.s.profit{color:#ff6b6b;background:rgba(255,107,107,0.1);border-radius:3px;padding:1px 5px;text-align:center;font-weight:600}
.pnl.pos{color:var(--green)}.pnl.neg{color:var(--red)}
#goalBarWrap{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:7px 12px;background:var(--card);border:1px solid var(--border);border-radius:10px}
.goal-lbl{font-size:9px;color:var(--dim);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.goal-bar{flex:1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--border);position:relative}
.goal-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--green),var(--accent));border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.glow-pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
@media(max-width:640px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;width:100%;z-index:15;margin-left:0}
  #sidebar.hidden{margin-left:-100%}
  #main{margin-left:0!important}
  .cards{grid-template-columns:repeat(3,1fr)}.card .val{font-size:12px}
  .ct{grid-template-columns:36px 44px 44px 42px 34px;font-size:9px}
  .ot{grid-template-columns:36px 40px 40px 40px 38px 32px;font-size:9px}
}
</style></head><body>
<button id="toggle" onclick="toggleSidebar()">&#9776;</button>
<button id="themeBtn" onclick="toggleTheme()" style="position:fixed;right:12px;top:10px;z-index:200;background:var(--card);border:1px solid var(--border);color:var(--dim);padding:5px 10px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1;transition:.2s" title="Toggle theme"><svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
<div id="sidebar">
  <div class="sidebar-title">
    <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
    Grid Pro
  </div>
  <div class="ctrl-group"><label>Preset</label><select id="presetSel" onchange="presetChanged()">
    <option value="">Custom</option>
    <option value="ukraine">Ukraine War</option>
    <option value="crash2022">2022 Crash</option>
    <option value="svb">SVB Crisis</option>
    <option value="oct2023">Oct 2023 War</option>
    <option value="rally2024">Gold Rally 24</option>
    <option value="election2024">US Election 24</option>
    <option value="tariff2025">Tariff War 25</option>
    <option value="crash2026">130K Crash</option>
    <option value="jan2026">Jan 2026</option>
    <option value="july2026">July 2026</option>
    <option value="full2022">Normal 2022</option>
    <option value="all">Full Timeline</option>
    <option value="5m">1 Month</option>
    <option value="last7d">Last 7 Days</option>
    <option value="jul28">July 28</option>
  </select></div>
  <div class="ctrl-group"><label>Timeframe <span class="hint">TF</span></label><select id="tf"><option value="1m">1m</option><option value="5m">5m</option></select></div>
  <div class="ctrl-row">
    <div class="ctrl-group"><label>Lot</label><select id="lotSel"><option value="0.0001">0.0001</option><option value="0.001" selected>0.001</option><option value="0.01">0.01</option><option value="0.1">0.1</option></select></div>
    <div class="ctrl-group"><label>Speed</label><select id="speedSel" onchange="changeSpeed(this.value)"><option value="1">1x</option><option value="5">5x</option><option value="10">10x</option><option value="100" selected>100x</option><option value="1000">1Kx</option><option value="10000">10Kx</option></select></div>
  </div>
  <div class="ctrl-row">
    <div class="ctrl-group"><label>From</label><input type="date" id="dateFrom" value="2026-01-02"></div>
    <div class="ctrl-group"><label>To</label><input type="date" id="dateTo" value="2026-01-31"></div>
  </div>
  <div class="ctrl-row">
    <div class="ctrl-group"><label>Expiry <span class="hint">hrs</span></label><input type="number" id="expiryInp" value="4" min="0" max="9999"></div>
    <div class="ctrl-group"><label>Target <span class="hint">%</span></label><input type="number" id="profitTarget" value="0.1" min="0" max="100" step="0.1"></div>
  </div>
  <div class="ctrl-row">
    <div class="ctrl-group"><label>ATR Source</label><select id="atrSource"><option value="micro" selected>Micro</option><option value="macro">Macro</option></select></div>
    <div class="ctrl-group"><label>ATR Window</label><select id="atrWindow"><option value="1m">1m</option><option value="5m" selected>5m</option><option value="15m">15m</option><option value="1h">1h</option><option value="4h">4h</option><option value="1D">1D</option></select></div>
    <div class="ctrl-group"><label>Mode</label><select id="hardMode"><option value="false">Normal</option><option value="true">Hard</option></select></div>
  </div>
</div>
<div id="main">
  <div class="top">
    <h1>Grid Pro</h1>
    <div class="meta">
    <span id="presetLabel">Custom</span>
    <span style="margin-left:auto;font-size:9px;color:var(--dim);letter-spacing:.5px;font-weight:600">YONJAN VENTURES</span>
  </div>
  <div class="top-actions">
    <button id="startBtn" onclick="startSim()">Start</button>
    <button id="stopBtn" onclick="stopSim()" disabled class="danger">Stop</button>
  </div>

  </div>
  <div id="progress"><div class="fill" id="progFill"></div></div>
  <div class="status" id="statusBar"><span class="dot gray" id="statusDot"></span><span id="status">Ready. Select dates and Start.</span></div>
  <div id="chart"><canvas id="chartCanvas"></canvas></div>
  <div class="cards" id="cards">
    <div class="card blue"><div class="lbl">Price <span id="cTime" style="font-weight:400;color:var(--dim)">--</span></div><div class="val blue" id="cPrice">--</div></div>
    <div class="card green"><div class="lbl">Balance</div><div class="val" id="cBal">1,000,000</div></div>
    <div class="card green"><div class="lbl">Equity</div><div class="val" id="cEqu">1,000,000</div></div>
    <div class="card purple"><div class="lbl">Return</div><div class="val" id="cRet">0.00%</div></div>
    <div class="card blue"><div class="lbl">Spacing</div><div class="val" id="cSpc">--</div></div>
    <div class="card orange"><div class="lbl">ATR</div><div class="val" id="cAtr">--</div></div>
    <div class="card purple"><div class="lbl">Trades</div><div class="val" id="cTrd">0</div></div>
    <div class="card orange"><div class="lbl">Elapsed</div><div class="val" id="cDur">--</div></div>
    <div class="card blue"><div class="lbl">Bars</div><div class="val" id="cBar">0/0</div></div>
    <div class="card green"><div class="lbl">Win $</div><div class="val green" id="cWin">--</div></div>
    <div class="card red"><div class="lbl">Loss $</div><div class="val red" id="cLoss">--</div></div>
    <div class="card purple"><div class="lbl">Net P&L</div><div class="val" id="cNet">--</div></div>
    <div class="card red"><div class="lbl">Risk</div><div class="val red" id="cRisk">--</div></div>
    <div class="card orange"><div class="lbl">Target</div><div class="val" id="cGoal">0.1%</div></div>
  </div>
  <div id="goalBarWrap"><div class="goal-lbl">Profit Target</div><div class="goal-bar"><div class="goal-fill" id="goalFill"></div></div><div class="goal-lbl" id="goalPct">0.0%</div></div>
  <div class="tab-bar"><button class="tab-btn active" id="tabOpenBtn" onclick="switchTab('open')">Open Positions <span class="badge" id="openCount">0</span></button><button class="tab-btn" id="tabHistBtn" onclick="switchTab('history')">Trade History <span class="badge" id="closedCount">0</span><span class="badge" id="totRisk" style="margin-left:4px">0% risk</span></button></div>
  <div class="tab-panel active" id="tab-open"><div id="opentrades"><span style="color:var(--dim);font-size:11px">None</span></div></div>
  <div class="tab-panel" id="tab-history"><div id="tradesHistory"><span style="color:var(--dim);font-size:11px">No trades yet</span></div></div>
</div>
<script>
var PRESETS_DATA = {
  "ukraine":{s:"2022-01-01",e:"2022-06-30",l:"Ukraine War",spd:1000},
  "crash2022":{s:"2022-06-01",e:"2022-11-30",l:"2022 Crash",spd:1000},
  "svb":{s:"2023-02-01",e:"2023-05-31",l:"SVB Crisis",spd:1000},
  "oct2023":{s:"2023-09-01",e:"2023-11-30",l:"Oct 2023 War",spd:1000},
  "rally2024":{s:"2024-03-01",e:"2024-06-30",l:"Gold Rally 24",spd:1000},
  "election2024":{s:"2024-09-01",e:"2024-12-31",l:"US Election 24",spd:1000},
  "tariff2025":{s:"2025-03-01",e:"2025-06-30",l:"Tariff War 25",spd:1000},
  "crash2026":{s:"2026-01-01",e:"2026-03-31",l:"130K Crash",spd:1000},
  "jan2026":{s:"2026-01-02",e:"2026-01-31",l:"Jan 2026",spd:100},
  "july2026":{s:"2026-07-01",e:"2026-07-31",l:"July 2026",spd:100},
  "full2022":{s:"2022-01-01",e:"2022-12-31",l:"Normal 2022",spd:1000},
  "all":{s:"2022-01-01",e:"2026-07-31",l:"Full Timeline",spd:1000},
  "5m":{s:"2026-06-24",e:"2026-07-24",l:"1 Month",spd:50},
  "last7d":{s:"2026-07-19",e:"2026-07-24",l:"Last 7 Days",spd:100},
  "jul28":{s:"2026-07-28",e:"2026-07-28",l:"July 28",spd:10,tf:"1m",ex:99,lot:"0.001",atr:"micro",hm:"false"}
}
function presetChanged(){
  var k=$("presetSel").value,d=PRESETS_DATA[k]
  if(!k||!d)return
  $("dateFrom").value=d.s;$("dateTo").value=d.e;$("presetLabel").textContent=d.l
  if(d.spd)$("speedSel").value=d.spd
  if(d.tf)$("tf").value=d.tf
  if(d.lot)$("lotSel").value=d.lot
  if(d.ex)$("expiryInp").value=d.ex
  if(d.atr)$("atrSource").value=d.atr
  if(d.hm!=null)$("hardMode").value=d.hm
}
function switchTab(tab){
  document.querySelectorAll(".tab-btn").forEach(function(b){b.classList.toggle("active",b.id==="tab"+(tab==="open"?"Open":"Hist")+"Btn")})
  document.querySelectorAll(".tab-panel").forEach(function(p){p.classList.toggle("active",p.id==="tab-"+tab)})
}
var evtSource=null,chartData=[],chartCanvas,chartCtx,running=false,drawPending=false,doneReceived=false,sidebarVisible=true
var chartEntries=[],chartExits=[],seenEntries={},seenExits={},lastDraw=0

function $(i){return document.getElementById(i)}
function qs(s){return document.querySelector(s)}

function toggleTheme(){
  var b=document.body;b.classList.toggle("light");var isLight=b.classList.contains("light")
  $("themeIcon").innerHTML=isLight?'<circle cx="12" cy="12" r="5"/><g stroke="currentColor"><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></g>':'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
  localStorage.setItem("gridTheme",isLight?"light":"dark")
}
(function(){if(localStorage.getItem("gridTheme")==="light"){document.body.classList.add("light");$("themeIcon").innerHTML='<circle cx="12" cy="12" r="5"/><g stroke="currentColor"><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></g>'}})()
function toggleSidebar(){
  sidebarVisible=!sidebarVisible
  $("sidebar").classList.toggle("hidden",!sidebarVisible)
  $("main").style.marginLeft=sidebarVisible?"220px":"0"
  setTimeout(function(){if(chartCanvas){chartCanvas.width=chartCanvas.parentElement.clientWidth;chartCanvas.height=chartCanvas.parentElement.clientHeight;drawChart()}},300)
}
function initChart(){
  chartCanvas=$("chartCanvas");chartCtx=chartCanvas.getContext("2d")
  chartCanvas.width=chartCanvas.parentElement.clientWidth
  chartCanvas.height=chartCanvas.parentElement.clientHeight
}
function downsample(data,maxPts){
  if(data.length<=maxPts)return data
  var step=data.length/maxPts,out=[]
  for(var i=0;i<maxPts;i++)out.push(data[Math.floor(i*step)])
  return out
}
function drawChart(){
  try{
  if(!chartData.length)return
  var ctx=chartCtx,w=chartCanvas.width,h=chartCanvas.height
  ctx.clearRect(0,0,w,h)
  var pts=downsample(chartData,Math.min(500,w))
  var prices=pts.map(function(d){return d.p}),atrs=pts.map(function(d){return d.a||0})
  var pMin=Math.min.apply(null,prices),pMax=Math.max.apply(null,prices),pRng=pMax-pMin||1
  var aMin=Math.min.apply(null,atrs),aMax=Math.max.apply(null,atrs),aRng=aMax-aMin||1
  var step=w/pts.length,atrH=h*0.3
  function yP(v){return h*0.04+(v-pMin)/pRng*(h*0.56)}
  function yA(v){return h*0.66+(v-aMin)/aRng*atrH}
  function fmtP(v){return v.toFixed(1)}
  ctx.strokeStyle="rgba(255,255,255,0.04)";ctx.lineWidth=1;ctx.fillStyle="rgba(255,255,255,0.08)";ctx.font="8px monospace"
  for(var i=0;i<=5;i++){var gy=yP(pMin+pRng*i/5);ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(w,gy);ctx.stroke();ctx.fillText(fmtP(pMin+pRng*i/5),4,gy-3)}
  ctx.beginPath();ctx.strokeStyle="rgba(251,146,60,0.3)";ctx.lineWidth=1
  pts.forEach(function(d,i){var x=i*step;if(i===0)ctx.moveTo(x,yA(d.a));else ctx.lineTo(x,yA(d.a))})
  ctx.stroke();ctx.fillStyle="rgba(251,146,60,0.4)";ctx.font="7px monospace";ctx.fillText("ATR",4,h-2)
  ctx.beginPath();ctx.strokeStyle="#22d3ee";ctx.lineWidth=1.5
  pts.forEach(function(d,i){var x=i*step;if(i===0)ctx.moveTo(x,yP(d.p));else ctx.lineTo(x,yP(d.p))})
  ctx.stroke()
  ctx.fillStyle="rgba(255,255,255,0.12)";ctx.font="7px monospace"
  var tStep=Math.max(1,Math.floor(pts.length/6))
  for(var i=0;i<pts.length;i+=tStep){var x=i*step;ctx.fillText((pts[i].t||"").slice(5,16)||(i*step+"")||"",x,h-5)}
  for(var i=0;i<chartEntries.length;i++){
    var e=chartEntries[i],x=Math.min(e.idx/w*pts.length*step,w-5),y=yP(e.p),col=e.s==="buy"?"rgba(16,185,129,0.9)":"rgba(239,68,68,0.9)"
    ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle=col;ctx.fill()
    ctx.fillStyle="#fff";ctx.font="bold 7px monospace"
    var lbl=e.s==="buy"?"B":"S"
    ctx.fillText(lbl,x-3,y+3);ctx.fillStyle="rgba(255,255,255,0.25)";ctx.font="6px monospace";ctx.fillText(e.p.toFixed(1),x-9,y-7)
  }
  for(var i=0;i<chartExits.length;i++){
    var ex=chartExits[i],x=Math.min(ex.idx/w*pts.length*step,w-5),y=yP(ex.p),col=ex.s==="win"?"rgba(16,185,129,0.5)":"rgba(239,68,68,0.5)"
    ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle=col;ctx.fill()
  }
  if(chartData.length>0){
    var lastP=chartData[chartData.length-1].p,ly=yP(lastP)
    ctx.strokeStyle="rgba(34,211,238,0.25)";ctx.lineWidth=1;ctx.setLineDash([4,4])
    ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(w,ly);ctx.stroke();ctx.setLineDash([])
    ctx.fillStyle="rgba(34,211,238,0.5)";ctx.font="bold 9px monospace"
    ctx.fillText(fmtP(lastP),w-54,ly-4)
  }
  }catch(e){console.log("CHART_ERR:"+e.message)}
}
function setDot(color){
  var d=$("statusDot");d.className="dot "+color
}
function startSim(){
  $("startBtn").disabled=true;$("stopBtn").disabled=false;running=true;doneReceived=false;chartData=[]
  chartEntries=[];chartExits=[];seenEntries={};seenExits={}
  setDot("orange");$("status").textContent="Starting...";$("progFill").className="fill"
  if(evtSource)evtSource.close()
  var tf=$("tf").value,spd=parseInt($("speedSel").value),lot=parseFloat($("lotSel").value)
  var start=$("dateFrom").value,end=$("dateTo").value
  var expiry=parseInt($("expiryInp").value)||4
  var pt=parseFloat($("profitTarget").value)||0.1
  var as=$("atrSource").value,aw=$("atrWindow").value,hm=$("hardMode").value==="true"
  fetch("/micro-start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    start:start,end:end,expiry:expiry,atr_source:as,tf:tf,lot:lot,
    hard_mode:hm,speed:spd,atr_window:aw,profit_target:pt
  })})
  .then(function(r){return r.json()}).then(function(d){
    if(d.error){setDot("red");$("status").textContent="Error: "+d.error;running=false;$("startBtn").disabled=false;$("stopBtn").disabled=true;return}
    $("status").textContent="Running  "+d.bars+" bars  |  expiry="+d.expiry+"h  |  "+d.tf+"  |  goal="+d.profit_target+"%"
    $("cGoal").textContent=d.profit_target+"%"
    evtSource=new EventSource("/stream-micro")
    evtSource.onmessage=function(e){
      try{var msg=JSON.parse(e.data)
      if(msg.type==="init"){return}
      if(msg.type==="done"){
        $("status").textContent="Done. R:"+msg.return+"% DD:"+msg.dd+"% T:"+msg.trades+" Bal:$"+Number(msg.balance||0).toLocaleString()
        if(msg.chart&&msg.chart.length){chartData=msg.chart;drawChart()}
        updateUI(msg)
        setDot("green")
        doneReceived=true;evtSource.close();evtSource=null;running=false;$("startBtn").disabled=false;$("stopBtn").disabled=true
        $("progFill").className="fill"
        return
      }
      updateUI(msg)}catch(err){}
    }
    evtSource.onerror=function(){if(!doneReceived&&evtSource){setDot("red");$("status").textContent="SSE disconnected";evtSource=null}}
  }).catch(function(e){setDot("red");$("status").textContent="Error: "+e.message;running=false;$("startBtn").disabled=false;$("stopBtn").disabled=true})
}
function changeSpeed(v){
  fetch("/micro-speed",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({speed:parseInt(v)||100})}).catch(function(){})
}
function stopSim(){
  running=false;if(evtSource)evtSource.close()
  setDot("gray");$("status").textContent="Stopped."
  $("startBtn").disabled=false;$("stopBtn").disabled=true;$("progFill").className="fill"
}
function updateUI(msg){
  $("cPrice").textContent=msg.mid?msg.mid.toFixed(2):"--"
  $("cTime").textContent=msg.ts||"--"
  $("cBal").textContent=Number(msg.balance||0).toLocaleString("en",{maximumFractionDigits:0})
  $("cEqu").textContent=Number(msg.equity||0).toLocaleString("en",{maximumFractionDigits:0})
  var ret=msg.balance?((msg.balance-1000000)/1000000*100).toFixed(2):0
  $("cRet").textContent=(ret>=0?"+":"")+ret+"%";$("cRet").className="val"+(ret>=0?" green":" red")
  if(msg.dur!=null){var d=msg.dur,h=Math.floor(d/3600),m=Math.floor((d%3600)/60),s=d%60;$("cDur").textContent=h>0?h+"h "+m+"m":m>0?m+"m "+s+"s":s+"s"}
  $("cBar").textContent=(msg.bar||0)+"/"+(msg.total||0)
  if(msg.total){var pct=((msg.bar||0)/msg.total*100).toFixed(0);$("progFill").style.width=pct+"%";if(!doneReceived)$("progFill").className="fill active"}
  if(msg.mid&&msg.micro_atr!=null&&!doneReceived&&running){var pct=Math.round((msg.bar||0)/msg.total*100);var st=$("status").textContent;if(!st.startsWith("Done")&&!st.startsWith("Stopped"))$("status").textContent="Bar "+(msg.bar||0)+"/"+(msg.total||0)+" ("+pct+"%) ATR="+msg.micro_atr.toFixed(1)}
  $("cSpc").textContent=msg.spacing||"--"
  if(msg.micro_atr!=null)$("cAtr").textContent=msg.micro_atr.toFixed(1)+" "+(msg.atr_source||"?")+"/"+(msg.micro_atr_window||"?")
  $("cTrd").textContent=msg.positions?msg.positions.length:0
  if(msg.drawdown!=null){var dd=msg.drawdown,ddPct=dd/10000;$("cRisk").textContent=ddPct.toFixed(2)+"%";$("cRisk").className="val"+(ddPct>=10?" red":ddPct>=5?" orange":" green")}
  var wTot=0,lTot=0
  if(msg.hit_log){
    for(var i=0;i<msg.hit_log.length;i++){var h=msg.hit_log[i],pn=h.pnl||0;if(pn>0){wTot+=pn}else if(pn<0){lTot+=Math.abs(pn)}}
    $("cWin").textContent="$"+wTot.toFixed(1);$("cWin").className="val green"
    $("cLoss").textContent="$"+lTot.toFixed(1);$("cLoss").className="val red"
    var net=wTot-lTot
    $("cNet").textContent=(net>=0?"+":"")+"$"+net.toFixed(1);$("cNet").className="val"+(net>=0?" green":" red")
  }
  var tradeRows=[],seen={}
  if(msg.closed_trades) for(var i=msg.closed_trades.length-1;i>=0;i--){
    var c=msg.closed_trades[i];if(!c||!c.side)continue
    var key=c.side+"|"+c.entry;if(seen[key])continue;seen[key]=1
    var sc=c.side==="TP-BUY"||c.side==="BUY"?"side-buy":"side-sell"
    if(c.side.indexOf("HEDGE")>=0)sc="hedge"
    tradeRows.push({side:c.side,entry:c.entry||"--",exit:c.exit||"--",pnl:c.pnl||0,dur:c.dur||"--",t:"",cls:sc})
  }
  if(msg.hit_log) for(var i=msg.hit_log.length-1;i>=0;i--){
    var h=msg.hit_log[i];if(!h||!h.side)continue
    var key2=h.side+"|"+(h.price||"");if(seen[key2])continue;seen[key2]=1
    if(tradeRows.length>=100)continue
    var cls2=""
    if(h.side.indexOf("TP-")>=0)cls2="tp"
    else if(h.side.indexOf("HEDGE")>=0)cls2="hedge"
    else if(h.side.indexOf("PROFIT")>=0)cls2="profit"
    else if(h.side.indexOf("EXPIRY")>=0)cls2="expiry"
    tradeRows.push({side:h.side,entry:(h.price||""),exit:"",pnl:h.pnl||0,dur:"",t:(h.t||"").slice(0,5),cls:cls2})
  }
  tradeRows.sort(function(a,b){return b.t&&a.t?b.t.localeCompare(a.t):0})
  tradeRows=tradeRows.slice(0,100)
  if(tradeRows.length){
    var th='<div class="ct"><span class="hdr">Side</span><span class="hdr v">Entry</span><span class="hdr v">Exit</span><span class="hdr v">P&L</span><span class="hdr v">Dur</span></div>'
    for(var i=0;i<tradeRows.length;i++){
      var tr=tradeRows[i],pcl=tr.pnl>=0?"green":"red"
      th+='<div class="ct"><span class="v '+tr.cls+'">'+tr.side.slice(0,8)+'</span>'
      th+='<span class="v">'+tr.entry+'</span><span class="v">'+tr.exit+'</span>'
      th+='<span class="v '+pcl+'">'+(tr.pnl>=0?"+":"")+Number(tr.pnl).toFixed(2)+'</span>'
      th+='<span class="v">'+tr.dur+'</span></div>'
    }
    $("tradesHistory").innerHTML=th
    $("closedCount").textContent=tradeRows.length+" trades"
  }
  if(msg.positions){
    var bal=msg.balance||1000000,ot=[],totRiskNeg=0
    for(var i=0;i<msg.positions.length;i++){
      var p=msg.positions[i],rsk=p.pnl/bal*100
      if(rsk<0)totRiskNeg+=Math.abs(rsk)
      var sideCls=p.side==="buy"?"side-buy":"side-sell"
      ot.push('<div class="ot"><span class="v '+sideCls+'">'+(p.side||"").toUpperCase().slice(0,4)+'</span>')
      ot.push('<span class="v">'+p.entry+'</span><span class="v">'+(p.tp||"--")+'</span>')
      ot.push('<span class="v '+(p.pnl>=0?"green":"red")+'">'+(p.pnl>=0?"+":"")+p.pnl.toFixed(1)+'</span>')
      ot.push('<span class="v '+(rsk<0?"red":"green")+'">'+(rsk>=0?"+":"")+rsk.toFixed(2)+'%</span>')
      var dlHtml=''
      if(p.close_pct>0){dlHtml='<div style="display:inline-flex;align-items:center;gap:2px"><div style="width:20px;height:3px;background:var(--border);border-radius:2px;overflow:hidden"><div style="width:'+Math.min(p.close_pct,100)+'%;height:100%;background:var(--orange);border-radius:2px"></div></div><span style="font-size:8px;color:var(--orange)">'+Math.round(p.close_pct)+'%</span></div>'}
      else if(p.deadline_extended){dlHtml='<span style="font-size:9px;color:var(--yellow)">&#9203; EXT</span>'}
      else if(p.age_days>=15){dlHtml='<span style="font-size:9px;color:var(--red)">&#9888; '+p.age_days.toFixed(1)+'d</span>'}
      ot.push('<span class="v">'+(dlHtml||p.dur||"--")+'</span></div>')
    }
    $("opentrades").innerHTML=ot.length?'<div class="ot"><span class="hdr">Side</span><span class="hdr v">Entry</span><span class="hdr v">TP</span><span class="hdr v">P&L</span><span class="hdr v">Risk</span><span class="hdr v">Age</span></div>'+ot.join(''):'<span style="color:var(--dim);font-size:11px">None</span>'
    $("totRisk").textContent=totRiskNeg.toFixed(2)+'% risk'
  }
  if(msg.profit_target_pct&&msg.cumulative_pnl!=null){
    var targetAmt=1000000*msg.profit_target_pct/100
    var pct=targetAmt>0?Math.min(100,Math.max(0,msg.cumulative_pnl/targetAmt*100)):0
    $("goalFill").style.width=pct.toFixed(1)+"%"
    $("goalPct").textContent=pct.toFixed(1)+"%"
    $("cGoal").textContent=msg.profit_target_pct+"%"
  }
  if(msg.mid){
    var ts=new Date().toISOString()
    chartData.push({p:msg.mid,a:msg.micro_atr||0,t:ts})
    if(chartData.length>800)chartData=chartData.slice(-800)
    if(msg.positions) try{
      for(var i=0;i<msg.positions.length;i++){
        var p=msg.positions[i];if(!p||!p.side||!p.entry)continue
        var key=p.side+"@"+p.entry
        if(!seenEntries[key]){seenEntries[key]=1;chartEntries.push({idx:chartData.length,p:p.entry,s:p.side})}
      }
    }catch(e){}
    if(msg.hit_log) try{
      for(var i=0;i<msg.hit_log.length;i++){
        var h=msg.hit_log[i];if(!h)continue
        var key=(h.entry||"")+"@"+(h.exit||"")+"@"+(h.side||"")
        if(!seenExits[key]&&(h.exit||h.price)){
          seenExits[key]=1;chartExits.push({idx:chartData.length,p:h.exit||h.price||0,s:(h.pnl||0)>0?"win":"loss"})
        }
      }
    }catch(e){}
    var now=Date.now()
    if(!drawPending&&!doneReceived&&now-lastDraw>100){lastDraw=now;drawPending=true;setTimeout(function(){drawPending=false;drawChart()},50)}
  }
  if(doneReceived){setTimeout(function(){drawChart()},10)}
}
window.addEventListener("resize",function(){
  if(chartCanvas){chartCanvas.width=chartCanvas.parentElement.clientWidth;chartCanvas.height=chartCanvas.parentElement.clientHeight;drawChart()}
})
initChart()
</script></body></html>
